name: Build Android APK

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Test and build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android runner
        run: flutter create --platforms=android --org com.animpro --project-name animpro .

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze Dart source
        id: analyze
        continue-on-error: true
        shell: bash
        run: |
          set +e
          flutter analyze 2>&1 | tee "$RUNNER_TEMP/flutter-analyze.log"
          result=${PIPESTATUS[0]}
          python3 - "$RUNNER_TEMP/flutter-analyze.log" "$GITHUB_STEP_SUMMARY" "$result" <<'PY'
          import pathlib, re, sys
          log = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          clean = re.sub(r"\x1b\[[0-9;]*m", "", log)
          with open(sys.argv[2], "a", encoding="utf-8") as summary:
              summary.write("### flutter analyze\n\n```text\n" + clean[-12000:] + "\n```\n")
          lines = clean.splitlines()
          for line in lines:
              if " • " in line:
                  escaped = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::notice title=flutter analyze::{escaped}")
          if int(sys.argv[3]) != 0:
              for line in lines[-80:]:
                  if line.strip():
                      escaped = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      print(f"::error title=flutter analyze::{escaped}")
          PY
          exit "$result"

      - name: Run tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded 2>&1 | tee "$RUNNER_TEMP/flutter-test.log"
          result=${PIPESTATUS[0]}
          python3 - "$RUNNER_TEMP/flutter-test.log" "$GITHUB_STEP_SUMMARY" "$result" <<'PY'
          import pathlib, re, sys
          log = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          clean = re.sub(r"\x1b\[[0-9;]*m", "", log)
          with open(sys.argv[2], "a", encoding="utf-8") as summary:
              summary.write("### flutter test\n\n```text\n" + clean[-12000:] + "\n```\n")
          lines = clean.splitlines()
          if int(sys.argv[3]) != 0:
              for line in lines[-80:]:
                  if line.strip():
                      escaped = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      print(f"::error title=flutter test::{escaped}")
          PY
          exit "$result"

      - name: Build release APK
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          flutter build apk --release 2>&1 | tee "$RUNNER_TEMP/flutter-build.log"
          result=${PIPESTATUS[0]}
          python3 - "$RUNNER_TEMP/flutter-build.log" "$GITHUB_STEP_SUMMARY" "$result" <<'PY'
          import pathlib, re, sys
          log = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          clean = re.sub(r"\x1b\[[0-9;]*m", "", log)
          with open(sys.argv[2], "a", encoding="utf-8") as summary:
              summary.write("### flutter build apk --release\n\n```text\n" + clean[-12000:] + "\n```\n")
          lines = clean.splitlines()
          if int(sys.argv[3]) != 0:
              for line in lines[-100:]:
                  if line.strip():
                      escaped = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      print(f"::error title=flutter build apk::{escaped}")
          PY
          exit "$result"

      - name: Upload release APK
        if: steps.analyze.outcome == 'success' && steps.tests.outcome == 'success' && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: animpro-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Fail if any validation or build step failed
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.analyze.outcome }}" != "success" || \
                "${{ steps.tests.outcome }}" != "success" || \
                "${{ steps.build.outcome }}" != "success" ]]; then
            echo "::error::Step outcomes: analyze=${{ steps.analyze.outcome }}, tests=${{ steps.tests.outcome }}, build=${{ steps.build.outcome }}. See this job's step summary for details."
            exit 1
          fi
